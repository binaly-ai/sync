name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go generate ./cmd/binaly-sync
      - run: go build -ldflags "-H windowsgui" -o binaly-sync.exe ./cmd/binaly-sync

  cross-build:
    # The Windows build is the product; these keep the code portable for later.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./internal/...
      - run: go test ./internal/pathx/...

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The gitleaks scanner itself (MIT-licensed), not gitleaks-action, which needs a paid
      # license key for repositories owned by an organization. Scans the whole history.
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --redact --verbose
